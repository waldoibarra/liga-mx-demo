name: Update results and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: liga-mx-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: ${{ github.event_name != 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and validate results
        if: github.event_name != 'push'
        run: node scripts/update-results.mjs
      - name: Verify simulation rules and feed parsing
        run: node --test app/engine.test.mjs scripts/update-results.test.mjs
      - name: Keep the last valid snapshot
        if: github.event_name != 'push'
        id: snapshot
        run: |
          if ! git diff --quiet -- app/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/results.json
            git commit -m 'chore: update Liga MX results'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Package static site
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp app/index.html app/styles.css app/pitch.svg app/*.json "$RUNNER_TEMP/site/"
          cp app/dashboard.mjs app/edition.mjs app/engine.mjs app/worker.mjs "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: site
    if: github.event_name != 'schedule' || needs.site.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
